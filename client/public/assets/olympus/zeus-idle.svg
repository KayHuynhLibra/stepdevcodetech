<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <defs>
    <linearGradient id="cloak" x1="20" y1="40" x2="100" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3d2a6b"/><stop offset="1" stop-color="#1a0e30"/>
    </linearGradient>
    <linearGradient id="skin" x1="40" y1="20" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5d0a8"/><stop offset="1" stop-color="#d4a574"/>
    </linearGradient>
    <linearGradient id="bolt" x1="70" y1="50" x2="105" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6c8"/><stop offset=".5" stop-color="#7ec8ff"/><stop offset="1" stop-color="#3d9eff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- clouds -->
  <ellipse cx="30" cy="138" rx="28" ry="10" fill="#4a3a70" opacity=".55"/>
  <ellipse cx="90" cy="140" rx="32" ry="11" fill="#3a2a58" opacity=".5"/>
  <!-- cloak -->
  <path d="M38 72 C28 90 22 120 30 148 L90 148 C98 120 92 90 82 72 Z" fill="url(#cloak)" stroke="#f5c542" stroke-width="1.2" opacity=".95"/>
  <!-- torso -->
  <ellipse cx="60" cy="88" rx="22" ry="28" fill="url(#skin)"/>
  <!-- head -->
  <circle cx="60" cy="42" r="22" fill="url(#skin)"/>
  <!-- hair / beard -->
  <path d="M38 40 C36 18 52 8 60 10 C68 8 84 18 82 40 C78 28 70 24 60 26 C50 24 42 28 38 40 Z" fill="#f0e6d0"/>
  <path d="M44 52 C48 68 55 74 60 74 C65 74 72 68 76 52 C72 60 66 64 60 64 C54 64 48 60 44 52 Z" fill="#e8dcc4"/>
  <!-- eyes glow -->
  <circle cx="52" cy="42" r="2.2" fill="#7ec8ff" filter="url(#glow)"/>
  <circle cx="68" cy="42" r="2.2" fill="#7ec8ff" filter="url(#glow)"/>
  <!-- raised arm + bolt -->
  <path d="M78 78 C92 70 98 58 96 48" stroke="#d4a574" stroke-width="7" stroke-linecap="round"/>
  <path d="M94 46 L102 78 L96 72 L100 92 L88 68 L94 74 Z" fill="url(#bolt)" filter="url(#glow)"/>
  <!-- small arcs -->
  <path d="M28 60 Q20 70 26 82" stroke="#7ec8ff" stroke-width="1.5" opacity=".7" filter="url(#glow)"/>
  <path d="M90 100 Q104 110 96 122" stroke="#f5c542" stroke-width="1.2" opacity=".65" filter="url(#glow)"/>
</svg>
